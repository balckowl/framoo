name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Validate commit messages
        if: matrix.node-version == '22'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$PR_BASE_REF"
            BASE_SHA=$(git merge-base FETCH_HEAD "$PR_HEAD_SHA")
            npm run commitlint -- --from "$BASE_SHA" --to "$PR_HEAD_SHA" --verbose
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            npm run commitlint -- --from "$EVENT_BEFORE" --to "$COMMIT_SHA" --verbose
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$DEFAULT_BRANCH"
            BASE_SHA=$(git merge-base FETCH_HEAD "$COMMIT_SHA")
            npm run commitlint -- --from "$BASE_SHA" --to "$COMMIT_SHA" --verbose
          else
            npm run commitlint -- --last --verbose
          fi
      - name: Run release checks
        run: npm run check
